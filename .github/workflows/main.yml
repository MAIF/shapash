name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Cancel older runs for the same PR/branch when new commits arrive.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code_quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Git checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # required for setuptools-scm to read git tags
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml # it would be better on a lock file
    - name: Install dev dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install . --group dev
    - name: Check linting
      run: make lint
    - name: Check formatting
      run: make format
    - name: Check type annotations
      run: make typecheck

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: code_quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # One job measures coverage and uploads it: the others run the same suite.
          - python-version: "3.12"
            coverage: true
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # required for setuptools-scm to read git tags
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    # Full suite, NLP included. CPU-only torch first: the PyPI Linux wheel drags in several GB of
    # CUDA libraries the tests never use. The `nlp` extra's `torch>=` bound is then already
    # satisfied and pip keeps it.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install '.[nlp]' --group test
    # NLP test modules skip (not fail) when their imports are missing, so fail loudly here instead.
    - name: Check NLP stack is importable
      run: python -c "import torch, transformers, sentence_transformers, captum; print(torch.__version__)"
    # Models the NLP tests download from the Hugging Face Hub: reuse them instead of hitting the Hub
    # from every job. The key follows the tests, so a newly referenced model gets saved too.
    - name: Cache Hugging Face models
      uses: actions/cache@v6
      with:
        path: ~/.cache/huggingface
        key: hf-models-${{ hashFiles('tests/**/*.py') }}
        restore-keys: hf-models-
    - name: Test
      if: ${{ !matrix.coverage }}
      run: make test
    - name: Test and coverage
      if: ${{ matrix.coverage }}
      run: make coverage-report
    - name: Upload coverage to Codecov
      if: ${{ matrix.coverage }}
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
        disable_search: true
    # Pure-Python package: building it once is enough.
    - name: Build python package
      if: ${{ matrix.coverage }}
      run: |
        python -m pip install --upgrade build
        python -m build

  pandas_compat:
    name: Pandas Compat (${{ matrix.pandas }})
    needs: code_quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Lower bound + last 2.x. Latest pandas 3.x is already what the `test` jobs resolve to.
        pandas: ["2.2.2", "2.3.*"]
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # required for setuptools-scm to read git tags
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml
    # Classical-install jobs: deliberately without the `nlp` extra.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install . --group test "pandas==${{ matrix.pandas }}"
        python -c "import pandas; print(pandas.__version__)"
    - name: Check NLP stack is absent
      run: python -c "import importlib.util as u; assert u.find_spec('torch') is None, 'torch installed'"
    - name: Test
      run: make test
