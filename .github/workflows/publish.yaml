name: Publish to PyPI

on:
  release:
    types: [published]

concurrency:
  group: pypi-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.13"
      - name: Build package
        run: uv build
      - name: Store the distribution packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi-release
      url: https://pypi.org/project/shapash/
    permissions:
      id-token: write

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  smoke-test-pypi:
    name: Smoke test install from PyPI
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: python-package-distributions
          path: dist/
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - name: Resolve package version from tag
        id: package-version
        run: |
          # Parse the version from the built wheel filename rather than the git tag:
          # dynamic versioning normalizes the tag to PEP 440 (e.g. v1.2.0-rc1 -> 1.2.0rc1),
          # so the wheel name holds the exact version string published to the index.
          VERSION=$(python -c "import pathlib; print(next(pathlib.Path('dist').glob('*.whl')).name.split('-')[1])")
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Install and import from PyPI
        env:
          RELEASE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          python3 -m venv .venv-smoke
          . .venv-smoke/bin/activate
          for attempt in 1 2 3 4 5; do
            if pip install "shapash==${RELEASE_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "Failed to install shapash==${RELEASE_VERSION} from PyPI after retries."
              exit 1
            fi
            echo "Install not available yet on PyPI, retrying in 30s (attempt ${attempt}/5)..."
            sleep 30
          done
          python -c "import shapash; print(shapash.__version__)"
