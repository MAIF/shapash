default_language_version:
    python: python3
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-ast
    -   id: fix-byte-order-marker
    -   id: check-case-conflict
    -   id: check-merge-conflict
    -   id: check-docstring-first
    -   id: check-shebang-scripts-are-executable
    -   id: check-json
    -   id: check-toml
    -   id: check-yaml
        exclude: ^chart/
    -   id: debug-statements
    -   id: end-of-file-fixer
        exclude: ^(docs/|gdocs/)
    -   id: pretty-format-json
        args: ['--autofix']
        exclude: .ipynb
    -   id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
        exclude: ^(docs/|gdocs/)
    -   id: mixed-line-ending
        args: ['--fix=lf']
        exclude: ^(docs/|gdocs/)
    -   id: check-added-large-files
        args: ['--maxkb=3000']
# ruff and mypy run from the dev environment, so they use the versions pinned in uv.lock, the same ones
# CI runs. The entries look in .venv first (bin/ on Linux and macOS, Scripts/ on Windows, where git runs
# hooks through its bundled bash), so the hooks work without an activated venv.
-   repo: local
    hooks:
    -   id: ruff-check
        name: ruff check
        entry: bash -c 'PATH=".venv/bin:.venv/Scripts:$PATH" exec "$@"' -- ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
    -   id: ruff-format
        name: ruff format
        entry: bash -c 'PATH=".venv/bin:.venv/Scripts:$PATH" exec "$@"' -- ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
    -   id: mypy
        name: mypy
        entry: bash -c 'PATH=".venv/bin:.venv/Scripts:$PATH" exec "$@"' -- mypy shapash
        language: system
        pass_filenames: false
        files: ^shapash/.*\.py$
-   repo: https://github.com/adamchainz/blacken-docs
    rev: 1.20.0
    hooks:
    -   id: blacken-docs
        args: [--line-length=120]
        additional_dependencies: [black==26.5.1]
-   repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.3.0
    hooks:
    -   id: conventional-pre-commit
        stages: [commit-msg]
        args: [] # optional: list of Conventional Commits types to allow e.g. [feat, fix, ci, chore, test]
