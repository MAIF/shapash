# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    # setuptools-scm derives the version from the git tags
    post_checkout:
      - git fetch --unshallow --tags || true
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    # Same locked versions as CI. Non-editable, so the docs import the built package, not the checkout.
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --no-editable --no-default-groups --group doc --extra report
    # Tutorial notebooks and demo report (published as report.html, linked from the README)
    pre_build:
      - '"${READTHEDOCS_VIRTUALENV_PATH}/bin/python" scripts/prepare_docs.py'
